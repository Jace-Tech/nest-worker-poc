# EXAMPLE ONLY — do NOT commit real credentials. Copy to secret.yaml (gitignored)
# and fill in, or better, create it imperatively (no secret ever touches git):
#
#   # From your Upstash rediss:// URL: rediss://default:<PASSWORD>@<HOST>:<PORT>
#   kubectl -n queue-lab create secret generic queue-lab-redis \
#     --from-literal=REDIS_URL='rediss://default:<PASSWORD>@<HOST>:<PORT>' \
#     --from-literal=REDIS_ADDRESS='<HOST>:<PORT>' \
#     --from-literal=REDIS_PASSWORD='<PASSWORD>'
#
# Why three keys:
#   REDIS_URL       - consumed by the worker (ioredis parses the full URL + TLS).
#   REDIS_ADDRESS   - host:port, consumed by KEDA's redis scaler (it can't parse a URL).
#   REDIS_PASSWORD  - consumed by KEDA's redis scaler via TriggerAuthentication.
apiVersion: v1
kind: Secret
metadata:
  name: queue-lab-redis
  namespace: queue-lab
type: Opaque
stringData:
  REDIS_URL: "rediss://default:REPLACE_ME@REPLACE_HOST:6379"
  REDIS_ADDRESS: "REPLACE_HOST:6379"
  REDIS_PASSWORD: "REPLACE_ME"
